<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/642805505a.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div class="backgroundCarousel">
        <div class="backgroundImg1"></div>
        <div class="backgroundImg2"></div>
        <div class="backgroundImg3"></div>
    </div>
    <div class="container">
        <div class="carousel">
            <div class="images">
                <div class="img1">
                    <div class="imgContainer">
                        <div class="imgFadeInBox fadeInEffectDarken"></div>
                        <img src="../img/margherita.jpg" alt="">
                    </div>
                </div>
                
                <div class="img2">
                    <div class="imgContainer">
                        <div class="imgFadeInBox fadeInEffectLighten"></div>
                        <img src="../img/salsicciaepatate.jpg" alt="">
                    </div>
                </div>

                <div class="img3">
                    <div class="imgContainer">
                        <div class="imgFadeInBox fadeInEffectDarken"></div>
                        <img src="../img/funghieprosciutto.jpg" alt="">
                    </div>
                </div>
                
            </div>
            <div class="leftRightButtons">
                <div onclick="moveSliderLeft()" class="leftButton" id="leftButton">
                    <i class="fa-solid fa-chevron-left"></i>
                </div>
                <div onclick="moveSliderRight()" class="rightButton" id="rightButton">
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
            </div>
        </div>
    </div>
    </body>
</html>
