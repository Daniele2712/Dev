<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/642805505a.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="slide.css">
    <script src="slide.js" defer></script>
    <title>Slide</title>
</head>
<body>
    <section id="menu">
        <div class="menu__carousel">
            <div class="images">
                <div class="img1">
                    <div class="imgContainer">
                        <div class="imgFadeInBox fadeInEffectDarken"></div>
                        <img src="../img/marinara.jpg" alt="" class="image-ratio">
                    </div>
                </div>
                
                <div class="img2">
                    <div class="imgContainer">
                        <div class="imgFadeInBox fadeInEffectDarken"></div>
                        <img src="../img/salsicciaepatate.jpg" alt="" class="image-ratio">
                    </div>
                </div>

                <div class="img3">
                    <div class="imgContainer">
                        <div class="imgFadeInBox fadeInEffectLighten"></div>
                        <img src="../img/margherita.jpg" alt="" class="image-ratio">
                    </div>
                </div>

                <div class="img4">
                    <div class="imgContainer">
                        <div class="imgFadeInBox fadeInEffectDarken"></div>
                        <img src="../img/funghieprosciutto.jpg" alt="" class="image-ratio">
                    </div>
                </div>

                <div class="img5">
                    <div class="imgContainer">
                        <div class="imgFadeInBox fadeInEffectDarken"></div>
                        <img src="../img/quattroformaggi.jpg" alt="" class="image-ratio">
                    </div>
                </div>
                
            </div>
            <div class="leftRightButtons">
                <div onclick="moveSliderLeft()" class="leftButton" id="leftButton">
                    <i class="fa-solid fa-chevron-left"></i>
                </div>
                <div onclick="moveSliderRight()" class="rightButton" id="rightButton">
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
            </div>
        </div>
    <div class="menu__description">
        <p class="menu__catch-phrase">Scopri i nostri deliziosi piatti e prenota ora.</p>
        <a href="menu.html"><button class="menu__btn">Visualizza il menù</button></a>
    </div>
    </section>
    </body>
</html>
