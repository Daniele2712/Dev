spring:
        datasource:
            url: jdbc:mysql://localhost:3316/mysql-bc
            username: root
            password: root
            driver-class-name: org.mysql.Driver
        jpa:
           hibernate:
               ddl-auto: update
           show-sql: false
           properties:
               hibernate:
                   format_sql: true
           database: mysql
           database-platform: org.hibernate.dialect.MySQLDialect
        mail:
            host: localhost
            port: 1025
            username: user
            password: password
            properties:
                mail:
                    smtp:
                        trust: "*"
                    auth: true
                    starttls:
                         enable: true
                    connectiontimeout: 5000
                    timeout: 3000
                    writetimeout: 5000